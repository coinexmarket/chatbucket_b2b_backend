name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what the Dockerfile and requirements
        # target — a wheel that stops shipping for a new Python shows up here
        # rather than in a failed deploy.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts

      - name: Smoke tests (B2B platform)
        run: python -m scripts.smoke_b2b

      - name: Smoke tests (site endpoints)
        run: python -m scripts.smoke_test

      # Both suites run against an in-memory Mongo, so no service container is
      # needed and CI stays a single job.

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chatbucket-b2b-backend .
      - name: Container starts and answers /health
        run: |
          # No MONGODB_URI, so /health must report 503 rather than hang or
          # crash — that is the behaviour load balancers depend on.
          docker run -d --name cb -p 8000:8000 \
            -e ENVIRONMENT=development chatbucket-b2b-backend
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { docker logs cb; exit 1; }
          curl -s http://localhost:8000/health | grep -q '"database"' || { docker logs cb; exit 1; }
          docker rm -f cb
