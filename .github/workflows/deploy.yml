name: Build, test and deploy

# One workflow for both jobs a change needs: proving it works, and shipping it.
# They were separate files, which ran the suites twice on every push to main.
#
# Pull requests stop after the image smoke test. Only main and a manual dispatch
# publish, and only once the suites have passed.
on:
  push:
    branches: [main]
  pull_request:
  # So an image can be rebuilt and shipped without an empty commit.
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession must not race to publish `latest`; the older
  # one is abandoned rather than allowed to overwrite the newer image.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to an exact patch. A floating major tag is a moving
# target: the same commit can build differently tomorrow because someone else
# released, and nothing in this repository would record it. Upgrades are a
# commit, reviewed like any other. The cost is that security patches arrive
# only when bumped -- check periodically rather than assuming.
env:
  REGISTRY: registry.digitalocean.com/chatbucket
  IMAGE: b2b-backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what the Dockerfile and requirements
        # target — a wheel that stops shipping for a new Python shows up here
        # rather than in a failed deploy.
        #
        # 3.12 is what the image runs today; 3.14 is here so a base-image bump
        # can be judged on evidence. Testing only up to 3.13 while Dependabot
        # offers 3.14-slim would let a green pipeline ship a runtime nothing
        # had ever exercised.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts
      # Both suites run against an in-memory Mongo, so no service container is
      # needed and this gate cannot touch production data.
      - name: Smoke tests (B2B platform)
        run: python -m scripts.smoke_b2b
      - name: Smoke tests (site endpoints)
        run: python -m scripts.smoke_test

  image-smoke:
    # Pull requests only. On main the image is built by `publish` and proven by
    # production's own health check, so building it twice would buy nothing.
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -t chatbucket-b2b-backend .
      - name: Container starts and answers /health
        run: |
          # No MONGODB_URI, so /health must report 503 rather than hang or
          # crash — that is the behaviour load balancers depend on.
          docker run -d --name cb -p 8000:8000 \
            -e ENVIRONMENT=development chatbucket-b2b-backend
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { docker logs cb; exit 1; }
          curl -s http://localhost:8000/health | grep -q '"database"' || { docker logs cb; exit 1; }
          docker rm -f cb

  publish:
    # The image is only built once the suites pass on every supported Python.
    # App Platform's own deploy-on-push has no such gate -- it ships whatever
    # arrives, and a red main would go straight to production.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to the registry
        run: doctl registry login --expiry-seconds 1200

      # Tagged with the commit as well as `latest`: `latest` is what App
      # Platform follows, and the commit tag is what a rollback names. Without
      # it there is no way to ask for "the image from before this one".
      - name: Build
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE:${{ github.sha }}" \
            -t "$REGISTRY/$IMAGE:latest" .

      - name: Push the commit tag
        run: docker push "$REGISTRY/$IMAGE:${{ github.sha }}"

      # Pushed last, and separately: this is the tag that triggers the deploy,
      # so it must not move until the immutable one is safely stored.
      - name: Push latest, which triggers the deploy
        run: docker push "$REGISTRY/$IMAGE:latest"

      # App Platform reacts to the push asynchronously, so wait for the running
      # service to actually answer rather than reporting success at upload.
      - name: Wait for production to serve the new image
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf https://api.b2b.chatbucket.business/health || true)
            case "$body" in
              *'"database":"up"'*) echo "$body"; exit 0;;
            esac
            sleep 20
          done
          echo "health never reported the database up after the deploy" >&2
          exit 1
