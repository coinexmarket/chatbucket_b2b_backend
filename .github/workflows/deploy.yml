name: Build and deploy

# Push to main -> test -> build the image -> push it to the registry.
# App Platform is subscribed to that repository and redeploys itself when a new
# `latest` lands, so nothing here calls the deploy API.
on:
  push:
    branches: [main]
  # So an image can be rebuilt and shipped without an empty commit.
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession must not race to publish `latest`; the older
  # one is abandoned rather than allowed to overwrite the newer image.
  group: publish-production
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/chatbucket
  IMAGE: b2b-backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts
      # Both suites run against an in-memory Mongo, so this gate needs no
      # database and cannot touch production data.
      - name: Smoke tests (B2B platform)
        run: python -m scripts.smoke_b2b
      - name: Smoke tests (site endpoints)
        run: python -m scripts.smoke_test

  publish:
    # The image is only built once the suites pass on every supported Python.
    # App Platform's own deploy-on-push has no such gate -- it ships whatever
    # arrives, and a red main would go straight to production.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to the registry
        run: doctl registry login --expiry-seconds 1200

      # Tagged with the commit as well as `latest`: `latest` is what App
      # Platform follows, and the commit tag is what a rollback names. Without
      # it there is no way to ask for "the image from before this one".
      - name: Build
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE:${{ github.sha }}" \
            -t "$REGISTRY/$IMAGE:latest" .

      - name: Push the commit tag
        run: docker push "$REGISTRY/$IMAGE:${{ github.sha }}"

      # Pushed last, and separately: this is the tag that triggers the deploy,
      # so it must not move until the immutable one is safely stored.
      - name: Push latest, which triggers the deploy
        run: docker push "$REGISTRY/$IMAGE:latest"

      # App Platform reacts to the push asynchronously, so wait for the running
      # service to actually answer rather than reporting success at upload.
      - name: Wait for production to serve the new image
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf https://api.b2b.chatbucket.business/health || true)
            case "$body" in
              *'"database":"up"'*) echo "$body"; exit 0;;
            esac
            sleep 20
          done
          echo "health never reported the database up after the deploy" >&2
          exit 1
