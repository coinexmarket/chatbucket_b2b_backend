# App Platform spec for chatbucket-b2b-backend.
#
# Secrets are redacted: this repository is public, and the live values
# are held encrypted by App Platform. See DEPLOY.md.
domains:
- domain: api.b2b.chatbucket.business
  type: PRIMARY
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: api
    match:
      path:
        prefix: /
name: chatbucket-b2b-backend
region: blr
services:
- envs:
  - key: ENVIRONMENT
    scope: RUN_TIME
    value: production
  - key: MONGODB_URI
    scope: RUN_TIME
    type: SECRET
    value: ${MONGODB_URI}
  - key: JWT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ${JWT_SECRET}
  - key: BILLING_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ${BILLING_WEBHOOK_SECRET}
  - key: STATUS_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ${STATUS_WEBHOOK_SECRET}
  - key: OPS_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ${OPS_SECRET}
  - key: EMAIL_BACKEND
    scope: RUN_TIME
    value: smtp
  - key: SMTP_HOST
    scope: RUN_TIME
    value: smtp.gmail.com
  - key: SMTP_PORT
    scope: RUN_TIME
    value: '587'
  - key: SMTP_STARTTLS
    scope: RUN_TIME
    value: 'true'
  - key: SMTP_USE_SSL
    scope: RUN_TIME
    value: 'false'
  - key: SMTP_USERNAME
    scope: RUN_TIME
    value: Support@chatbucket.business
  - key: SMTP_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: ${SMTP_PASSWORD}
  - key: EMAIL_FROM
    scope: RUN_TIME
    value: Support@chatbucket.business
  - key: EMAIL_FROM_NAME
    scope: RUN_TIME
    value: ChatBucket
  - key: SALES_EMAIL
    scope: RUN_TIME
    value: Support@chatbucket.business
  - key: RAZORPAY_KEY_ID
    scope: RUN_TIME
    value: ${RAZORPAY_KEY_ID}
  - key: RAZORPAY_KEY_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ${RAZORPAY_KEY_SECRET}
  - key: RAZORPAY_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ${RAZORPAY_WEBHOOK_SECRET}
  - key: APP_BASE_URL
    scope: RUN_TIME
    value: https://chatbucket.business
  - key: TRUST_PROXY_HEADERS
    scope: RUN_TIME
    value: 'true'
  - key: CORS_ORIGINS
    scope: RUN_TIME
    value: https://chatbucket.business,https://www.chatbucket.business,https://chatbucket.chat,https://www.chatbucket.chat
  health_check:
    failure_threshold: 3
    http_path: /health
    initial_delay_seconds: 30
    period_seconds: 30
    success_threshold: 1
    timeout_seconds: 5
  http_port: 8000
  image:
    deploy_on_push:
      enabled: true
    registry: chatbucket
    registry_type: DOCR
    repository: b2b-backend
    tag: latest
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  name: api
