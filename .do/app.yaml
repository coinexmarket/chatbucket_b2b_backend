name: chatbucket-b2b-backend
region: blr
features:
  - buildpack-stack=ubuntu-22
services:
  - name: api
    git:
      repo_clone_url: https://github.com/coinexmarket/chatbucket_b2b_backend.git
      branch: main
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        value: "${MONGODB_URI}"
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${JWT_SECRET}"
      - key: BILLING_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${BILLING_WEBHOOK_SECRET}"
      - key: STATUS_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${STATUS_WEBHOOK_SECRET}"
      - key: OPS_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${OPS_SECRET}"
      - key: EMAIL_BACKEND
        scope: RUN_TIME
        value: smtp
      - key: SMTP_HOST
        scope: RUN_TIME
        value: smtp.gmail.com
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_STARTTLS
        scope: RUN_TIME
        value: "true"
      - key: SMTP_USE_SSL
        scope: RUN_TIME
        value: "false"
      - key: SMTP_USERNAME
        scope: RUN_TIME
        value: Support@chatbucket.business
      - key: SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${SMTP_PASSWORD}
      - key: EMAIL_FROM
        scope: RUN_TIME
        value: Support@chatbucket.business
      - key: EMAIL_FROM_NAME
        scope: RUN_TIME
        value: ChatBucket
      - key: SALES_EMAIL
        scope: RUN_TIME
        value: Support@chatbucket.business
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: https://chatbucket.business
      - key: TRUST_PROXY_HEADERS
        scope: RUN_TIME
        value: "true"
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "https://chatbucket.business,https://www.chatbucket.business,https://chatbucket.chat,https://www.chatbucket.chat"
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: api
domains:
- domain: api.b2b.chatbucket.business
  type: PRIMARY
